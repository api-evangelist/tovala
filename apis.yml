name: Tovala
description: Tovala is a Chicago-based food-technology company that pairs a fresh
  meal delivery service with its proprietary smart countertop ovens. Weekly rotating,
  chef-crafted meals ship with QR codes that the Tovala Smart Oven (5-in-1) and Smart
  Oven Pro (6-in-1 with steam) scan to cook automatically, eliminating shopping,
  prepping, and cleanup. The company also offers GLP-1 balanced and high-protein
  menus, flexible meal plans, and a consumer mobile app backed by its api.tovala.com
  platform. Tovala is a Y Combinator portfolio company.
